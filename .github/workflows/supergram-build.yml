name: supergram-build
on:
  push:
    branches: [supergram-v4.1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"
      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/ \;
          ls -lah out
      - uses: actions/upload-artifact@v4
        with:
          name: heliboard-supergram-apks
          path: out/*.apk
          if-no-files-found: error
