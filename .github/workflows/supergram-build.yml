name: supergram-build

on:
  push:
    branches:
      - supergram-v4.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/ \;
          ls -lah out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-supergram-apks
          path: out/*.apk
          if-no-files-found: error
